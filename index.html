<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teamation - Making Movies for Kids</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,600;0,800;1,800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            green: '#00FF66',
                            greenHover: '#00D655',
                            dark: '#0A0A0A',
                            surface: '#141414',
                            border: '#222222'
                        }
                    },
                    fontFamily: {
                        heading: ['Syne', 'sans-serif'],
                        body: ['Plus Jakarta Sans', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbar and animations */
        body {
            background-color: #0A0A0A;
            color: #FFFFFF;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
        }

        .neon-glow {
            text-shadow: 0 0 20px rgba(0, 255, 102, 0.4);
        }

        .neon-box-glow {
            box-shadow: 0 0 25px rgba(0, 255, 102, 0.15);
        }

        /* Movie Slate Clapboard Animation */
        .clapboard-top {
            transform-origin: bottom left;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .clapboard-card:hover .clapboard-top,
        .clapboard-card:active .clapboard-top {
            transform: rotate(-15deg);
        }

        /* Viewport Framing Overlay */
        .film-strip-border {
            background-image: repeating-linear-gradient(
                to right,
                #00FF66 0px,
                #00FF66 12px,
                transparent 12px,
                transparent 24px
            );
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-brand-green selection:text-brand-dark">

    <!-- Top Decorative Film Strip Line -->
    <div class="w-full h-1.5 film-strip-border opacity-70"></div>

    <!-- Header Navigation -->
    <header class="w-full max-w-md mx-auto px-6 pt-6 flex items-center justify-between">
        <div class="flex items-center space-x-2">
            <span class="w-3 h-3 rounded-full bg-brand-green inline-block animate-pulse"></span>
            <span class="font-heading font-extrabold text-2xl tracking-wider text-white">
                TEAM<span class="text-brand-green">ATION</span>
            </span>
        </div>
        <span class="text-xs font-semibold uppercase tracking-widest text-brand-green border border-brand-green/30 bg-brand-green/10 px-3 py-1 rounded-full">
            For Kids
        </span>
    </header>

    <!-- Main Content Container -->
    <main class="w-full max-w-md mx-auto px-6 py-8 flex-1 flex flex-col justify-center space-y-8">

        <!-- Hero Section featuring Film Slate Graphic Concept -->
        <section class="text-center space-y-4">
            <!-- Interactive Clapperboard Emblem -->
            <div class="clapboard-card relative w-32 h-32 mx-auto cursor-pointer flex flex-col justify-center items-center my-2">
                <!-- Clapper Top -->
                <div class="clapboard-top w-28 h-6 bg-brand-green rounded-t-sm flex overflow-hidden border-b-2 border-brand-dark">
                    <div class="w-1/4 h-full bg-brand-dark transform -skew-x-12"></div>
                    <div class="w-1/4 h-full bg-transparent"></div>
                    <div class="w-1/4 h-full bg-brand-dark transform -skew-x-12"></div>
                    <div class="w-1/4 h-full bg-transparent"></div>
                </div>
                <!-- Clapper Body -->
                <div class="w-28 h-20 bg-brand-surface border-2 border-brand-green rounded-b-lg flex flex-col justify-around p-2 text-center neon-box-glow">
                    <span class="text-[10px] font-mono tracking-widest text-brand-green uppercase">SCENE 01</span>
                    <span class="font-heading font-extrabold text-white text-xs tracking-wider">TEAMATION</span>
                    <span class="text-[9px] font-mono text-gray-400">ROLL: 100</span>
                </div>
            </div>

            <!-- Title & Subtitle -->
            <div class="space-y-2">
                <h1 class="font-heading text-4xl sm:text-5xl font-extrabold tracking-tight leading-tight">
                    MAKING <br><span class="text-brand-green neon-glow">MOVIES</span>
                </h1>
                <p class="text-lg font-medium text-gray-300 pt-1">
                    Created especially for <span class="text-white font-bold border-b border-brand-green">Kids</span>.
                </p>
            </div>
        </section>

        <!-- Brand Vibe Cards Section (Authentic, Nice, Unique) -->
        <section class="space-y-3">
            <h2 class="text-xs font-mono uppercase tracking-widest text-gray-400 text-center">How It Feels</h2>
            
            <div class="grid grid-cols-3 gap-3">
                <!-- Authentic -->
                <div class="bg-brand-surface border border-brand-border rounded-xl p-3 text-center transition-transform hover:-translate-y-1">
                    <div class="w-2 h-2 rounded-full bg-brand-green mx-auto mb-2"></div>
                    <h3 class="font-heading font-extrabold text-xs tracking-wider text-white uppercase">Authentic</h3>
                </div>

                <!-- Nice -->
                <div class="bg-brand-surface border border-brand-border rounded-xl p-3 text-center transition-transform hover:-translate-y-1">
                    <div class="w-2 h-2 rounded-full bg-brand-green mx-auto mb-2"></div>
                    <h3 class="font-heading font-extrabold text-xs tracking-wider text-white uppercase">Nice</h3>
                </div>

                <!-- Unique -->
                <div class="bg-brand-surface border border-brand-border rounded-xl p-3 text-center transition-transform hover:-translate-y-1">
                    <div class="w-2 h-2 rounded-full bg-brand-green mx-auto mb-2"></div>
                    <h3 class="font-heading font-extrabold text-xs tracking-wider text-white uppercase">Unique</h3>
                </div>
            </div>
        </section>

        <!-- What We Make Section -->
        <section class="bg-brand-surface border border-brand-green/30 rounded-2xl p-6 text-center space-y-4 neon-box-glow">
            <div class="inline-flex items-center space-x-2 text-brand-green">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 002-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                </svg>
                <span class="text-xs font-mono font-bold tracking-widest uppercase">Things Made</span>
            </div>
            
            <div class="py-2">
                <span class="font-heading text-3xl font-extrabold tracking-wide text-white block">
                    MOVIES
                </span>
            </div>

            <!-- Visual Decorative Reel Dots -->
            <div class="flex justify-center items-center space-x-2 pt-2">
                <span class="w-2 h-2 rounded-full bg-brand-green"></span>
                <span class="w-2 h-2 rounded-full bg-brand-green/50"></span>
                <span class="w-2 h-2 rounded-full bg-brand-green/20"></span>
            </div>
        </section>

    </main>

    <!-- Bottom Decorative & Footer Section -->
    <footer class="w-full max-w-md mx-auto px-6 pb-8 text-center space-y-4">
        <!-- Bottom Film Strip Line -->
        <div class="w-full h-1 film-strip-border opacity-50 mb-6"></div>

        <p class="font-heading text-sm text-gray-400">
            <span class="text-white font-bold">Teamation</span>
        </p>

        <!-- Required AI Attribution -->
        <p class="text-xs text-gray-500 font-mono">
            Made with help from AI.
        </p>
    </footer>

</body>
</html>
